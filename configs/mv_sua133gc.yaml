# =============================================================================
# 老 USB2.0 相机 MindVision MV-SUA133GC-T1V-C 的配置（接在实机上的第一手验证用）
#
# 只服务于「取流 / 检测」这类程序：
#   ./build/camera_test -c=configs/mv_sua133gc.yaml -d      # 只验取流（帧率直接打在日志里）
#   ./build/detect_freq_visual_test -c=configs/mv_sua133gc.yaml -m=live -d
# 端到端主链路（minimum_vision_system / uav）需要标定、planner、cboard 等键，
# 本文件没有，请用完整配置（configs/demo.yaml 等）再把相机段换成下面这段。
#
# 关于 USB2.0（480Mbps）：本机实测（Jetson Orin Nano，相机 f622:0001 SN 043070620316，
# 走 480M 口/hub）——默认预设 1280x1024、Bayer8 原始数据、frame_speed=1：
#     1280x1024  ~35.7 fps   0 丢帧      （原始 1.25 MB/帧 ≈ 45 MB/s，USB2.0 已跑满）
#     1024x768   ~59 fps     0 丢帧
#     800x600    ~95 fps     0 丢帧
#     640x480    ~134 fps    0 丢帧
#     320x240    ~250 fps    0 丢帧
#   结论：**默认 1280x1024 就能稳定跑 35fps，不需要改分辨率**（改分辨率反而会让标定失效）。
#   frame_speed 在 1280x1024 下 0/1/2 实测都是 ~35.7fps（瓶颈在 USB 链路，不在 sensor）。
#   程序启动时会打印：枚举到的设备、分辨率/帧速/输出格式列表、USB 链路速度、单帧原始大小、
#   带宽估算上限帧率、usbfs 内存上限；关闭时打印采集统计（共/有效/丢帧）。排查就靠这些。
#   ⚠️ 同一枚相机只能被一个进程打开：CameraInit 返回 -18（设备已经打开）说明上一次的程序
#      没退干净（被 kill / Ctrl+C 或两个程序同时在跑），pgrep -a 找到后杀掉再试。
# =============================================================================

#####-----工业相机（MindVision，USB2.0 老相机）-----#####
camera_name: "mindvision"
exposure_ms: 2
gamma: 0.5
# 本机实测（lsusb -d f622:0001 -v）：MV-SUA133GC，序列号 043070620316，接在 480M 口上
# ⚠️ 注意：仓库里原来的 configs/camera.yaml 写的是 f622:d13a，与本机这枚相机（f622:0001）不同，
#    改别的机器前先用 `lsusb` 核对（启动日志也会打印配置的 vid_pid 在总线上是否存在）
vid_pid: "f622:0001"

# 设备选择（多相机同时插着时用；没写就是第 0 个）
mv_device_index: 0
# mv_friendly_name: "MV-SUA133GC"   # 非空时按昵称选，优先于 mv_device_index

# 帧速模式：0 低速 / 1 普通 / 2 高速（USB2.0 带宽不够时改 0）
mv_frame_speed: 1

# 掉线是否用 libusb 复位重连（默认 true）
mv_usb_reset: true

# 可选：输出分辨率（默认 -1 = 用相机预设，不要随便改，会失效标定）
# mv_resolution_width: 1280
# mv_resolution_height: 1024

# 可选：输出原始格式索引（默认 -1 = 不改，索引见启动日志的「输出格式」列表）
# mv_media_type: 0

# 可选：数字增益（SDK 设定值，100 = 1.0 倍；默认 -1 = 不改）
# mv_gain: 100

# ============================================================================
# 固定 pipeline（逐项显式置位 + 回读校验）
#
# 为什么需要：只设曝光/伽马的话，其余 ISP 参数（模拟增益、白平衡、色温、锐度、对比度、
# 饱和度、抗闪、光源频率）全部沿用"相机或 SDK 上一次会话留下的值" —— 换机器、或被别的
# 程序（MindVision 官方演示程序）动过之后，成像会悄悄变化，标定与阈值跟着漂。
#
# 下面凡是在 yaml 里写了的键，open() 都按固定顺序显式下发，然后逐项 CameraGet* 回读并打到
# 启动日志里（搜索"回读"）。两次启动的回读块应当逐行一致（只有时间戳不同）；不一致就说明
# 还有东西在动成像 —— 直接 diff 两份日志即可定位。
#
# 本机实测值（MV-SUA133GC，USB2.0，2026-09）就固定在下面：
mv_analog_gain: 64          # 模拟增益（传感器侧，噪声低于数字增益；范围 [?,?] 见失败告警）
mv_clr_temp_mode: 1         # 1 = 预设色温（0 自动识别 / 1 预设 / 2 自定义）
mv_clr_temp_gain: "100,100,100"  # 预设色温下的 R,G,B 增益（100 = 1.0 倍，0~400）
mv_sharpness: 0             # 锐度：0 = 不锐化（检测任务不要锐化，边缘会抖）
mv_contrast: 100            # 对比度：100 = 原始
mv_saturation: 100          # 饱和度：100 = 原始色度
mv_anti_flick: 0            # 抗闪：关（开 = 曝光会被锁到工频周期整数倍，改变曝光节奏）
mv_light_frequency: 0       # 光源频率：0 = 50Hz（与电网一致；60Hz 地区才改 1）

# ⚠️ 下面两组键在本机这枚相机上**不支持**，别写（写了每次启动都会告警 status=-4）：
#   mv_wb_mode: 0        # CameraSetWbMode 返回 -4；相机本来就是"手动白平衡"（回读可见）
#   mv_frame_rate: 0     # CameraSetFrameRate 返回 -4；"期望帧率"恒为 0Hz = 不限速
# 这两项仍会出现在回读日志里（白平衡模式=手动、期望帧率=0 Hz），只是不走"显式下发"。

# 可选：做一次白平衡（会覆盖上面的 mv_clr_temp_gain，且只在手动白平衡下有意义）
# mv_once_wb: false

# ---------------------------------------------------------------------------
# 可选：参数存取对象 / 掩码 / "黄金方案"文件（跨机器复制成像方案）
#
# ⚠️ 顺序有实测要求：CameraSetParameterMode 会让 SDK 按参数表重载一次，把曝光侧冲回默认
#    （自动曝光=开、曝光≈10ms、伽马=100）。代码里 setup_parameter_source() 已排在曝光设置
#    之前，所以写这些键是安全的；但**不要**把它们挪到曝光设置之后（回读日志会立刻暴露）。
# mv_parameter_mode: 1                 # 0 按型号 / 1 按昵称 / 2 按序列号 / 3 相机内置存储
# mv_parameter_mask: 131071            # 0x1FFFF = 全部参数表（PROP_SHEET_INDEX_* 位）
# mv_parameter_file: "assets/mv_sua133gc_pipeline.config"       # 启动时从文件恢复
# mv_parameter_save_file: "assets/mv_sua133gc_pipeline.config"  # 退出时把本次生效参数存成文件
# mv_parameter_load_group: 0           # 从参数组加载（0..3 = A/B/C/D，255 = 出厂默认）
# mv_parameter_save_group: 0           # 把本次生效参数保存到参数组
# mv_data_dir: "Camera"                # SDK 数据目录（.config/.mvdat 位置），空 = SDK 默认
# ----------------------------------------------------------------------------

#####-----神经网络参数（检测用）-----#####
yolo_name: yolov5
min_confidence: 0.8

# 实机走 TensorRT；未装 TensorRT 时会明确报错并降级为只测取流/显示（不会静默）
yolov5_backend: "trt"
yolov5_trt_engine_path: "assets/yolov5_0526_fp16.engine"
yolov5_onnx_path: "assets/yolov5_0526.onnx"

use_traditional: false

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false
