# =============================================================================
# Current-frame relative angles: offline replay (no camera or firmware required for dry-run)
#
# Relative-output/CBoard settings follow relative_current.yaml; acquisition uses video.
# Intrinsics belong to the recorded HikRobot camera and match configs/offline.yaml.
# Exercises detection -> current target selection -> PnP -> relative angles -> encoding.
#
#   ./build/relative_aim -c=configs/relative_current_replay.yaml -dry-run -n=200 -csv=/tmp/r.csv
#   ./build/relative_aim -c=configs/relative_current_replay.yaml -dry-run -n=200 -stream=8080
#
# WARNING: replay intrinsics differ from the actual MindVision camera; never use this on hardware.
# WARNING: video timestamps represent host frame-read time, not exposure time.
# =============================================================================
camera_name: "video"
video_path: "assets/demo/demo.avi"
video_loop: false
video_frame_rate: 0

#####-----Intrinsics: camera used to record demo.avi, 1280x1024-----#####
camera_matrix: [1818.3669452465165, 0, 751.06226574703498, 0, 1822.494494078506, 530.43671556112133, 0, 0, 1]
distort_coeffs: [-0.077944626599568856, 0.15447826031486889, -0.0025714394278524674, 0.00083016311301273629, 0]

# Demo hand-eye extrinsics from configs/offline.yaml, not actual-camera calibration.
# Ignored for camera_optical; used only for gimbal output.
R_camera2gimbal: [-0.0083195760046954614, 0.010498791137270739, 0.99991027599468041, -0.99960756138647755, -0.026835747568381807, -0.0080352891314148939, 0.026748978935305992, -0.99958472279097077, 0.010717933047771133]
t_camera2gimbal: [0.094969301833534511, 0.095006290298006682, 0.050987066291756609]

#####-----Detection model-----#####
yolo_name: yolov5
min_confidence: 0.8
yolov5_backend: "trt"
yolov5_trt_engine_path: "assets/yolov5_0526_fp16.engine"
yolov5_onnx_path: "assets/yolov5_0526.onnx"
use_traditional: false

roi:
  x: 420
  y: 50
  width: 600
  height: 600
use_roi: false

#####-----Enemy color: detectable armor in demo.avi-----#####
enemy_color: "blue"

#####-----Current-frame relative angles-----#####
relative_reference: "camera_optical"   # (camera_optical) | gimbal
relative_output_frame: "camera_optical"
relative_tx_shape: false
relative_max_frame_age_ms: 120         # (120) Replay age is approximately detection duration
relative_send_interval_ms: 0           # (0) Every eligible image
relative_min_confidence: 0.8
relative_max_reprojection_px: 15
relative_min_depth_m: 0.1
relative_filter_color: true

servo_gain: 1.0
servo_deadband_deg: 0.0
servo_max_step_deg: 20
servo_yaw_sign: 1
servo_pitch_sign: 1
servo_yaw_offset_deg: 0
servo_pitch_offset_deg: 0

#####-----CBoard (CAN)-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

can_command_mode: "relative"
cboard_wait_imu: false
relative_canid: 0xFE
vision_protocol: "v1"
vision_handshake_request_canid: 0x310
vision_handshake_response_canid: 0x311
vision_control_canid: 0x312
vision_can_ids_confirmed: false         # Dry-run only; use the separate vcan configuration
vision_control_timeout_ms: 500
relative_frame_timeout_ms: 120
relative_tx_rate_hz: 0
