# =============================================================================
# Current-frame relative angles: actual-camera configuration
#
# Entry: src/relative_aim.cpp (target relative_aim)
#   ./build/relative_aim -c=configs/relative_current.yaml                # Live: approved IDs + firmware required
#   ./build/relative_aim -c=configs/relative_current.yaml -dry-run -n=200 # Compute only
#   ./build/relative_aim -c=configs/relative_current.yaml -stream=8080    # Headless HUD stream
#   ./build/relative_aim -c=configs/relative_current.yaml -csv=/tmp/r.csv # Per-image CSV
#
# Agree semantics with firmware; see documentation/vision_cboard_protocol.md.
#   camera_optical: each image reports target error relative to the optical axis,
#   originating at the optical center. Intrinsics only; actual hand-eye calibration is pending.
#   gimbal requires calibrated R_camera2gimbal / t_camera2gimbal.
#
# Camera settings (exposure/gamma/fixed pipeline/intrinsics) match mv_sua133gc.yaml.
# Relative-output and CBoard sections add keys without changing existing configurations.
# =============================================================================

#####-----Industrial camera: MindVision MV-SUA133GC, USB3.0 cable-----#####
camera_name: "mindvision"
exposure_ms: 2
gamma: 0.5
vid_pid: "f622:0001"

mv_device_index: 0
mv_frame_speed: 1
mv_usb_reset: true

# Fixed pipeline: explicit writes and readback; see configs/mv_sua133gc.yaml.
mv_analog_gain: 64
mv_clr_temp_mode: 1
mv_clr_temp_gain: "100,100,100"
mv_sharpness: 0
mv_contrast: 100
mv_saturation: 100
mv_anti_flick: 0
mv_light_frequency: 0
# Unsupported on this camera (status=-4 on every startup); do not add:
#   mv_wb_mode / mv_frame_rate

#####-----Intrinsics: 1280x1024, calibrated 2026-10-10, RMS 0.224 px-----#####
camera_matrix: [1646.694479464929, 0, 629.3347317116185, 0, 1649.159708561839, 518.9448176031, 0, 0, 1]
distort_coeffs: [-0.07563482581065475, 0.274743634586268, 0.001505720850613093, 0.0007716521495002592, 0]

#####-----Detection model-----#####
yolo_name: yolov5
min_confidence: 0.8
yolov5_backend: "trt"
yolov5_trt_engine_path: "assets/yolov5_0526_fp16.engine"
yolov5_onnx_path: "assets/yolov5_0526.onnx"
use_traditional: false

roi:
  x: 420
  y: 50
  width: 600
  height: 600
use_roi: false

#####-----Enemy color: standalone filter; v1 uses remote CONTROL color-----#####
enemy_color: "blue"

#####-----Current-frame relative angles-----#####
# Optional current-path settings; parenthesized values describe defaults.
# Important values are explicit for reproducible deployment and inspection.
relative_reference: "camera_optical"   # (camera_optical) | gimbal
relative_output_frame: "camera_optical" # Coordinates, not protocol; compatibility key retained above
relative_tx_shape: false               # No gain/deadband/step shaping of measurements
relative_max_frame_age_ms: 120         # (120) Stale observations invalidate control
relative_send_interval_ms: 0           # (0) Every eligible image; 50 means at most 20 Hz valid output
relative_min_confidence: 0.8           # (min_confidence) Additional confidence threshold
relative_max_reprojection_px: 15       # (15) Maximum mean reprojection error
relative_min_depth_m: 0.1              # (0.1) Minimum forward camera depth in meters
relative_filter_color: true            # (true with enemy_color) Retain selected enemy color

# Signs/offsets apply to measurements; gain/deadband/step need relative_tx_shape: true.
# With these signs/offsets, TX differs from raw only by 1e-4 rad quantization.
# Firmware owns closed-loop limits; see documentation/relative_can_protocol.md section 6.
servo_gain: 1.0
servo_deadband_deg: 0.0
servo_max_step_deg: 20
servo_yaw_sign: 1
servo_pitch_sign: 1
servo_yaw_offset_deg: 0
servo_pitch_offset_deg: 0

#####-----CBoard (CAN)-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

# Explicit relative mode and no quaternion wait are mandatory and checked before
# constructing CBoard, avoiding a hang at [Cboard] Waiting for q...
can_command_mode: "relative"
cboard_wait_imu: false
relative_canid: 0xFE
vision_protocol: "v1"
# Candidate IDs only: firmware approval is required before hardware connection.
vision_handshake_request_canid: 0x310
vision_handshake_response_canid: 0x311
vision_control_canid: 0x312
vision_can_ids_confirmed: false         # Set true only after all four IDs are approved
vision_control_timeout_ms: 500
relative_frame_timeout_ms: 120
relative_tx_rate_hz: 0
